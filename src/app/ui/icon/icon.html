<!-- Ein gemeinsames <svg> für alle Namen: gleiches Raster, gleiche Strichstärke, gleiche Farbe.
     Die Pfade darin sind bewusst schlicht gehalten - bei 20-24px trägt jedes zusätzliche Detail
     nur noch Matsch bei. -->
<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.role]="decorative() ? null : 'img'"
  [attr.aria-label]="label()"
  [attr.aria-hidden]="decorative() ? 'true' : null"
>
  @switch (name()) {
    @case ('archive') {
      <rect x="3.5" y="4.5" width="17" height="4.5" rx="1.5" />
      <path d="M5.5 9v9a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5V9" />
      <path d="M10 13h4" />
    }
    @case ('brush') {
      <path d="M18.6 3.4a2.2 2.2 0 0 1 2 3.7l-7.2 7.2-3.5-3.5 7.2-7.2z" />
      <path d="M9.9 10.8 6.2 14.5c-1.4 1.4-1 3-2.7 4.5 2.7 1.6 5.7 1 7.2-.5l3.4-3.4z" />
    }
    @case ('bug') {
      <rect x="7.5" y="7.5" width="9" height="11" rx="4.5" />
      <path d="M9.6 7.5a2.4 2.4 0 0 1 4.8 0" />
      <path d="M7.5 11H4.5M16.5 11h3M7.5 15.5H4.5M16.5 15.5h3" />
      <path d="M9.3 5.6 7.9 4.2M14.7 5.6l1.4-1.4" />
    }
    @case ('card') {
      <rect x="6" y="3.5" width="12" height="17" rx="2.5" />
      <path d="M9 7.5h2.2M12.8 16.5H15" />
    }
    @case ('chart') {
      <!-- Drei Balken auf gemeinsamer Grundlinie - ohne gezeichnete Achse, die bei 22px nur
           als vierter Strich mitliefe. -->
      <rect x="4.4" y="10" width="4.3" height="9.6" rx="1.3" />
      <rect x="9.9" y="4.6" width="4.3" height="15" rx="1.3" />
      <rect x="15.4" y="13.2" width="4.3" height="6.4" rx="1.3" />
    }
    @case ('comment') {
      <!-- Sprechblase mit angesetzter Spitze statt eines eigenen Dreiecks-Pfads: ein zweiter,
           getrennter Strich sähe bei 22px nach einem Fehler im Rahmen aus. -->
      <path
        d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-4 4v-4h-1.5a2 2 0 0 1-2-2z"
      />
    }
    @case ('check') {
      <path d="m5 12.5 4.5 4.5L19 7.5" />
    }
    @case ('copy') {
      <!-- Zwei Karten hintereinander: die hintere nur mit ihrer sichtbaren Ecke, sonst wird es
           bei 22px zum Gitter. -->
      <rect x="8.5" y="8.5" width="11" height="11" rx="2.2" />
      <path d="M15.5 5.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2" />
    }
    @case ('crown') {
      <path d="M3.5 7.5 7.5 11.5 12 5l4.5 6.5 4-4-1.6 10H5.1z" />
      <path d="M5.5 20h13" />
    }
    @case ('deck') {
      <rect x="3.5" y="6.5" width="11" height="13.5" rx="2" />
      <path d="M7.5 4h9a2.5 2.5 0 0 1 2.5 2.5v9" />
    }
    @case ('dice') {
      <rect x="4" y="4" width="16" height="16" rx="3.5" />
      <circle cx="9" cy="9" r="1.15" fill="currentColor" stroke="none" />
      <circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none" />
      <circle cx="15" cy="15" r="1.15" fill="currentColor" stroke="none" />
    }
    @case ('download') {
      <path d="M12 4v10.5" />
      <path d="m7.8 10.6 4.2 4.2 4.2-4.2" />
      <path d="M5 17.5v1.2a1.8 1.8 0 0 0 1.8 1.8h10.4a1.8 1.8 0 0 0 1.8-1.8v-1.2" />
    }
    @case ('exchange') {
      <path d="M4 9h13" />
      <path d="m14 6 3 3-3 3" />
      <path d="M20 15H7" />
      <path d="m10 12-3 3 3 3" />
    }
    @case ('exile') {
      <circle cx="12" cy="12" r="8.2" />
      <path d="m9.2 14.8 5.6-5.6" />
      <path d="M10.6 9.2h4.2v4.2" />
    }
    @case ('graveyard') {
      <path d="M6 19.5V9.5a6 6 0 0 1 12 0v10z" />
      <path d="M12 7.5v6M9.5 10h5" />
      <path d="M4 19.5h16" />
    }
    @case ('help') {
      <circle cx="12" cy="12" r="8.5" />
      <path d="M9.6 9.5a2.5 2.5 0 0 1 4.9.5c0 1.7-2.5 2-2.5 3.6" />
      <circle cx="12" cy="16.8" r="0.9" fill="currentColor" stroke="none" />
    }
    @case ('image') {
      <rect x="3.5" y="5" width="17" height="14" rx="2.5" />
      <circle cx="8.8" cy="10" r="1.6" />
      <path d="m4.5 17.2 4.3-4.3 3.4 3.4 2.6-2.6 4.7 4.7" />
    }
    @case ('inbox') {
      <path d="M12 3.5v9.5" />
      <path d="m8.2 9.3 3.8 3.7 3.8-3.7" />
      <path d="M4.5 15v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V15" />
    }
    @case ('layers') {
      <path d="m12 3.5 8.5 4.3L12 12 3.5 7.8z" />
      <path d="m3.5 12 8.5 4.2L20.5 12" />
      <path d="m3.5 16.2 8.5 4.3 8.5-4.3" />
    }
    @case ('link') {
      <path d="M10.2 14a4.2 4.2 0 0 0 5.9 0l3-3a4.2 4.2 0 0 0-5.9-5.9l-1.4 1.4" />
      <path d="M13.8 10a4.2 4.2 0 0 0-5.9 0l-3 3A4.2 4.2 0 0 0 10.8 19l1.4-1.4" />
    }
    @case ('lock') {
      <rect x="4.5" y="10" width="15" height="9.5" rx="2.5" />
      <path d="M8 10V7.8a4 4 0 0 1 8 0V10" />
    }
    @case ('mail') {
      <!-- Umschlag: Klappe als offenes V, nicht als geschlossenes Dreieck - bei 22px verschmelzen
           die beiden Schenkel sonst mit dem oberen Rahmenrand. -->
      <rect x="3.5" y="5.5" width="17" height="13" rx="2.2" />
      <path d="m4.5 7.5 6.3 5a2 2 0 0 0 2.4 0l6.3-5" />
    }
    @case ('outbox') {
      <path d="M12 13V3.5" />
      <path d="m8.2 7.2 3.8-3.7 3.8 3.7" />
      <path d="M4.5 15v3.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V15" />
    }
    @case ('package') {
      <path d="m12 3.2 8 4v9.6l-8 4-8-4V7.2z" />
      <path d="m4 7.2 8 4 8-4" />
      <path d="M12 11.2v9.6" />
    }
    @case ('palette') {
      <path
        d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.9-.8 1.9-1.7s-.7-1.4-.7-2.2c0-.8.7-1.4 1.6-1.4h1.6a4.2 4.2 0 0 0 4.1-4.2c0-4.1-3.8-7.5-8.5-7.5z"
      />
      <circle cx="8" cy="10.2" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="12" cy="7.6" r="1.1" fill="currentColor" stroke="none" />
      <circle cx="16" cy="10.2" r="1.1" fill="currentColor" stroke="none" />
    }
    @case ('pencil') {
      <path d="m15.6 4.4 4 4L9 19l-4.5.5L5 15z" />
      <path d="m13.4 6.6 4 4" />
    }
    @case ('play') {
      <circle cx="12" cy="12" r="8.5" />
      <path d="M10.4 8.7 16 12l-5.6 3.3z" fill="currentColor" />
    }
    @case ('plus') {
      <path d="M12 5.5v13M5.5 12h13" />
    }
    @case ('refresh') {
      <path d="M20 12a8 8 0 1 1-2.5-5.8" />
      <path d="M20.5 3.8v4.4h-4.4" />
    }
    @case ('search') {
      <circle cx="11" cy="11" r="6.8" />
      <path d="m16 16 4 4" />
    }
    @case ('share') {
      <circle cx="17.5" cy="6" r="2.6" />
      <circle cx="6.5" cy="12" r="2.6" />
      <circle cx="17.5" cy="18" r="2.6" />
      <path d="m8.8 10.8 6.4-3.5M8.8 13.2l6.4 3.5" />
    }
    @case ('shuffle') {
      <path d="M3.5 7h3.3L17 17.5h3.5" />
      <path d="M3.5 17.5h3.3L17 7h3.5" />
      <path d="m18 4.5 2.5 2.5L18 9.5" />
      <path d="m18 15 2.5 2.5L18 20" />
    }
    @case ('skull') {
      <path
        d="M12 3.5c-4.3 0-7.4 3-7.4 7 0 2.3 1.1 3.9 2.4 4.9V18A1.5 1.5 0 0 0 8.5 19.5h7A1.5 1.5 0 0 0 17 18v-2.6c1.3-1 2.4-2.6 2.4-4.9 0-4-3.1-7-7.4-7z"
      />
      <circle cx="9.3" cy="11" r="1.5" />
      <circle cx="14.7" cy="11" r="1.5" />
      <path d="M10.4 16v3.5M13.6 16v3.5" />
    }
    @case ('swords') {
      <!-- Zwei gekreuzte Klingen: Spitze jeweils als Ecke oben, darunter Parierstange und Griff. -->
      <path d="M3.5 7V3.5H7l10.2 10.2" />
      <path d="m15.4 18.2 2.8-2.8" />
      <path d="m17.2 16.4 3.3 3.3" />
      <path d="M20.5 7V3.5H17L6.8 13.7" />
      <path d="m8.6 18.2-2.8-2.8" />
      <path d="M6.8 16.4 3.5 19.7" />
    }
    @case ('tag') {
      <path d="M11.4 3.5H20.5v9.1l-8.4 8.4a1.5 1.5 0 0 1-2.1 0l-7-7a1.5 1.5 0 0 1 0-2.1z" />
      <circle cx="16.4" cy="7.6" r="1.4" />
    }
    @case ('trash') {
      <path d="M4.5 7h15" />
      <path d="M9.5 7V5.4A1.4 1.4 0 0 1 10.9 4h2.2a1.4 1.4 0 0 1 1.4 1.4V7" />
      <path d="m6.6 7 .9 11.4A1.8 1.8 0 0 0 9.3 20h5.4a1.8 1.8 0 0 0 1.8-1.6L17.4 7" />
      <path d="M10.4 11v5M13.6 11v5" />
    }
    @case ('trophy') {
      <path d="M7.5 4h9v4.8a4.5 4.5 0 0 1-9 0z" />
      <path d="M7.5 5.5H5a2.5 2.5 0 0 0 2.8 2.5" />
      <path d="M16.5 5.5H19a2.5 2.5 0 0 1-2.8 2.5" />
      <path d="M12 13.3V16.5" />
      <path d="M8.5 20h7" />
      <path d="M9.8 20v-1.5a1 1 0 0 1 1-1h2.4a1 1 0 0 1 1 1V20" />
    }
    @case ('unlock') {
      <rect x="4.5" y="10" width="15" height="9.5" rx="2.5" />
      <path d="M8 10V7.8a4 4 0 0 1 7.7-1.5" />
    }
    @case ('user') {
      <circle cx="12" cy="8" r="3.8" />
      <path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2" />
    }
    @case ('users') {
      <circle cx="9.2" cy="8.4" r="3.6" />
      <path d="M2.8 20c0-3.6 2.9-6 6.4-6s6.4 2.4 6.4 6" />
      <circle cx="17.4" cy="9" r="2.7" />
      <path d="M17.4 14.6c2.3 0 3.8 2.2 3.8 5.4" />
    }
    @case ('warning') {
      <path d="M12 4.2 21 19.6H3z" />
      <path d="M12 10v4" />
      <circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none" />
    }
    @case ('wrench') {
      <path
        d="M15.6 3.5a5.2 5.2 0 0 0-4.8 7.2l-7.2 7.2 2.5 2.5 7.2-7.2a5.2 5.2 0 0 0 6.5-6.6l-3 3-2.5-.6-.6-2.5 3-3a5.2 5.2 0 0 0-1.1-.1z"
      />
    }
  }
</svg>

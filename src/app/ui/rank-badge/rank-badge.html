<svg
  viewBox="0 -8 100 112"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label()"
  [attr.aria-hidden]="label() ? null : 'true'"
>
  <defs>
    <linearGradient [attr.id]="gid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" [attr.stop-color]="colors().light" />
      <stop offset="1" [attr.stop-color]="colors().dark" />
    </linearGradient>
    <radialGradient [attr.id]="gid + '-glow'" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" [attr.stop-color]="colors().light" stop-opacity="0.55" />
      <stop offset="1" [attr.stop-color]="colors().light" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Schein hinter dem Schild, ab Diamant -->
  @if (level() >= 6) {
    <circle cx="50" cy="48" r="52" [attr.fill]="'url(#' + gid + '-glow)'" />
  }

  <!-- Flügel ab Gold, mit jedem Rang ausladender -->
  @if (level() >= 4) {
    <g
      [attr.fill]="'url(#' + gid + ')'"
      [attr.stroke]="colors().dark"
      stroke-width="1.5"
      stroke-linejoin="round"
    >
      @if (level() >= 6) {
        <path d="M20 26 C6 24 -4 34 -6 50 C2 44 8 46 12 48 C4 52 0 60 0 68 C8 60 14 60 20 60 Z" />
        <path
          d="M80 26 C94 24 104 34 106 50 C98 44 92 46 88 48 C96 52 100 60 100 68 C92 60 86 60 80 60 Z"
        />
      } @else {
        <path d="M20 30 C8 30 2 40 0 52 C8 46 14 48 20 52 Z" />
        <path d="M80 30 C92 30 98 40 100 52 C92 46 86 48 80 52 Z" />
      }
    </g>
  }

  <!-- Krone ab Platin -->
  @if (level() >= 5) {
    <path
      d="M34 12 L36 -2 L43 6 L50 -6 L57 6 L64 -2 L66 12 Z"
      [attr.fill]="'url(#' + gid + ')'"
      [attr.stroke]="colors().dark"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
  }

  <!-- Schild -->
  <path
    d="M50 8 L82 19 V46 C82 68 68 82 50 92 C32 82 18 68 18 46 V19 Z"
    [attr.fill]="'url(#' + gid + ')'"
    [attr.stroke]="colors().dark"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <path
    d="M50 15 L76 24 V46 C76 64 65 76 50 85 C35 76 24 64 24 46 V24 Z"
    fill="none"
    stroke="#fff"
    stroke-opacity="0.45"
    stroke-width="1.5"
  />

  <!-- Wappenzeichen je Rang -->
  <g [attr.stroke]="colors().dark" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    @switch (tier()) {
      @case ('wood') {
        <path d="M32 36 Q50 30 68 36 M30 48 Q50 42 70 48 M33 60 Q50 54 67 60" fill="none" />
      }
      @case ('iron') {
        <rect x="30" y="41" width="40" height="10" rx="2" fill="#fff" fill-opacity="0.35" />
        <circle cx="33" cy="30" r="2.5" [attr.fill]="colors().dark" />
        <circle cx="67" cy="30" r="2.5" [attr.fill]="colors().dark" />
        <circle cx="36" cy="64" r="2.5" [attr.fill]="colors().dark" />
        <circle cx="64" cy="64" r="2.5" [attr.fill]="colors().dark" />
      }
      @case ('bronze') {
        <polygon
          points="50.0,35.0 52.7,42.3 60.5,42.6 54.4,47.4 56.5,54.9 50.0,50.6 43.5,54.9 45.6,47.4 39.5,42.6 47.3,42.3"
          fill="#fff"
          fill-opacity="0.7"
        />
      }
      @case ('silver') {
        <circle cx="50" cy="46" r="19" fill="none" stroke-opacity="0.6" />
        <polygon
          points="50.0,32.0 53.4,41.3 63.3,41.7 55.5,47.8 58.2,57.3 50.0,51.8 41.8,57.3 44.5,47.8 36.7,41.7 46.6,41.3"
          fill="#fff"
        />
      }
      @case ('gold') {
        <circle cx="50" cy="46" r="19" fill="#fff" fill-opacity="0.25" />
        <polygon
          points="50.0,31.0 53.6,41.0 64.3,41.4 55.9,47.9 58.8,58.1 50.0,52.2 41.2,58.1 44.1,47.9 35.7,41.4 46.4,41.0"
          fill="#fff8dc"
        />
      }
      @case ('platinum') {
        <polygon points="50,30 63,38 63,54 50,62 37,54 37,38" fill="#fff" fill-opacity="0.75" />
        <polygon
          points="50,36 57,41 57,51 50,56 43,51 43,41"
          [attr.fill]="colors().light"
          stroke-width="1.2"
        />
      }
      @case ('diamond') {
        <path d="M38 38 L44 30 H56 L62 38 L50 62 Z" fill="#eef6ff" />
        <path d="M38 38 H62 M44 30 L50 38 L56 30 M50 38 V62" fill="none" stroke-width="1.2" />
      }
      @case ('infinity') {
        <!-- Unendlich-Zeichen: dunkle Kontur unter heller Schleife -->
        <path
          d="M50 48 C45 38 29 38 29 48 C29 58 45 58 50 48 C55 38 71 38 71 48 C71 58 55 58 50 48 Z"
          fill="none"
          stroke-width="9"
        />
        <path
          d="M50 48 C45 38 29 38 29 48 C29 58 45 58 50 48 C55 38 71 38 71 48 C71 58 55 58 50 48 Z"
          fill="none"
          stroke="#fff4e6"
          stroke-width="4.5"
        />
        <circle cx="50" cy="30" r="2" fill="#fff4e6" stroke="none" />
        <circle cx="38" cy="66" r="1.5" fill="#fff4e6" stroke="none" />
        <circle cx="62" cy="66" r="1.5" fill="#fff4e6" stroke="none" />
      }
    }
  </g>

  <!-- Band mit der Division -->
  @if (numeral()) {
    <path
      d="M28 76 H72 L68 83 L72 90 H28 L32 83 Z"
      [attr.fill]="colors().dark"
      stroke="#fff"
      stroke-opacity="0.5"
      stroke-width="1"
    />
    <text class="numeral" x="50" y="87.5" text-anchor="middle" fill="#fff">{{ numeral() }}</text>
  }
</svg>

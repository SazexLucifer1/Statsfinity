@if (favorites().length > 0) {
  <ul class="player-list compact-list">
    @for (name of favorites(); track name) {
      <li>
        <span class="player-name">{{ name }}</span>
        <button class="icon-button" [disabled]="busy()" (click)="remove(name)" [attr.aria-label]="i18n.t('profile.removeAria')"><app-icon name="trash" /></button>
      </li>
    }
  </ul>
}

@if (favorites().length < maxCount()) {
  <input
    class="glass-input"
    type="text"
    [placeholder]="i18n.t('profile.searchCardPlaceholder')"
    [ngModel]="query()"
    (ngModelChange)="onSearchInput($event)"
    autofocus
  />
  @if (suggestions().length > 0) {
    <ul class="player-list compact-list">
      @for (s of suggestions(); track s) {
        <li class="clickable" (click)="add(s)">
          <span class="player-name">{{ s }}</span>
        </li>
      }
    </ul>
  }
}

@if (tutorial.activeTutorialId() && tutorial.currentStep(); as step) {
<div class="tutorial-backdrop">
  @if (targetRect(); as rect) {
    <div
      class="tutorial-spotlight"
      [style.top.px]="rect.top - 6"
      [style.left.px]="rect.left - 6"
      [style.width.px]="rect.width + 12"
      [style.height.px]="rect.height + 12"
    ></div>
  }

  <div
    class="tutorial-tooltip"
    [class.centered]="tooltipPosition().top === null"
    [style.top.px]="tooltipPosition().top"
    [style.left.px]="tooltipPosition().left"
  >
    <h3>{{ i18n.t(step.titleKey) }}</h3>
    <p class="hint">{{ i18n.t(step.textKey) }}</p>

    <div class="tutorial-progress">{{ tutorial.stepIndex() + 1 }} / {{ tutorial.currentSteps().length }}</div>

    <div class="tutorial-actions">
      <button class="glass-button small" (click)="skip()">{{ i18n.t('tutorial.skip') }}</button>
      <div class="tutorial-nav-buttons">
        @if (tutorial.stepIndex() > 0) {
          <button class="glass-button small" (click)="tutorial.prev()">{{ i18n.t('tutorial.back') }}</button>
        }
        <button class="glass-button small primary" (click)="tutorial.next()">
          {{ tutorial.stepIndex() === tutorial.currentSteps().length - 1 ? i18n.t('tutorial.finish') : i18n.t('tutorial.next') }}
        </button>
      </div>
    </div>
  </div>
</div>
}

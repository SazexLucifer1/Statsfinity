name: Forge card coverage

# Prüft, welche Commander-legalen Karten die Regel-Engine Forge kennt und welche davon der Forge-Bot
# schlecht spielt. Grundlage der Bracket-Simulation mit echten 4er-Pods, siehe scripts/forge/README.md.
#
# Nur von Hand auslösbar: "Actions" -> "Forge card coverage" -> "Run workflow". Braucht kein Secret
# und schreibt nichts in die Datenbank. Der Bericht steht in der Zusammenfassung des Laufs und hängt
# vollständig als Artefakt "forge-kartenabdeckung" daran.

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Die gepinnte Forge-Fassung steht an genau einer Stelle: in forge-setup.sh.
      - name: Forge-Fassung lesen
        id: forge
        run: echo "commit=$(grep -oP 'FORGE_COMMIT:-\K[0-9a-f]{40}' scripts/forge/forge-setup.sh)" >> "$GITHUB_OUTPUT"

      # Für die Abdeckung reichen die Kartenskripte - kein Java, kein Build.
      - uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ steps.forge.outputs.commit }}
          path: .forge/forge
          sparse-checkout: forge-gui/res/cardsfolder
          lfs: false

      - name: Scryfall-Export laden
        run: |
          URL=$(curl -sS https://api.scryfall.com/bulk-data | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).data.find(x=>x.type==="oracle_cards").jsonl_download_uri))')
          curl -sS -o oracle-cards.jsonl.gz "$URL"

      - name: Abdeckung berechnen
        run: |
          node scripts/forge/card-coverage.js .forge/forge/forge-gui/res oracle-cards.jsonl.gz forge-kartenabdeckung.md
          head -c 60000 forge-kartenabdeckung.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: forge-kartenabdeckung
          path: forge-kartenabdeckung.md

name: Forge pool probe

# Trennt Forge die Brackets überhaupt? Je Stufe 1-5 eine Stichprobe aus dem Archidekt-Vorrat
# (archidekt_deck_pool, Stufe vom Ersteller angegeben) gegen dieselben drei Test-Decks spielen und
# prüfen, ob die Winrate mit der Stufe steigt. Ablauf und Auswertung: scripts/forge/pool-probe.js
#
# Nur von Hand: "Actions" -> "Forge pool probe" -> "Run workflow". Zwei Runner je Stufe (eine Partie
# dauert bis zu vier Minuten, einer allein käme an die 6-Stunden-Grenze). Ergebnis: Tabelle in der
# Zusammenfassung des Laufs, alle Partien als Artefakt "pool-probe".
#
# Braucht das Repo-Secret SUPABASE_SERVICE_ROLE_KEY (der Vorrat ist nur für Developer lesbar).

on:
  workflow_dispatch:
    inputs:
      decks:
        description: 'Decks je Stufe'
        required: true
        default: '20'
      spiele:
        description: 'Partien je Deck'
        required: true
        default: '20'
      gegner:
        description: 'Stufe der Test-Decks, gegen die gespielt wird'
        required: true
        default: '4'

jobs:
  vorbereiten:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.fassung.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Forge-Fassung lesen
        id: fassung
        run: echo "commit=$(grep -oP 'FORGE_COMMIT:-\K[0-9a-f]{40}' scripts/forge/forge-setup.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Derselbe Cache wie in forge-einstufung.yml und forge-kalibrierung.yml.
      - uses: actions/cache@v4
        id: cache
        with:
          path: .forge
          key: forge-${{ steps.fassung.outputs.commit }}-${{ hashFiles('scripts/forge/pilot/**') }}
      - uses: actions/cache@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: maven-forge-${{ steps.fassung.outputs.commit }}
          restore-keys: maven-forge-
      - name: Forge bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/forge/forge-setup.sh .forge

  spielen:
    needs: vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        bracket: [1, 2, 3, 4, 5]
        teil: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # esbuild für den Siegplan (siegplan.js bündelt goldfish-sim.ts).
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: .forge
          key: forge-${{ needs.vorbereiten.outputs.commit }}-${{ hashFiles('scripts/forge/pilot/**') }}
          fail-on-cache-miss: true
      - name: Stufe ${{ matrix.bracket }} spielen (Teil ${{ matrix.teil }})
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Ein Runner hat 4 Kerne; eine Forge-Partie belegt gut einen davon.
        run: >
          node scripts/forge/pool-probe.js .forge/forge
          --bracket ${{ matrix.bracket }}
          --teil ${{ matrix.teil }}/2
          --decks '${{ inputs.decks }}'
          --spiele '${{ inputs.spiele }}'
          --gegner '${{ inputs.gegner }}'
          --parallel 3
          --aus teil-b${{ matrix.bracket }}-${{ matrix.teil }}.json
      # Auch nach Zeitüberschreitung hochladen: die bis dahin gespielten Partien zählen.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teil-b${{ matrix.bracket }}-${{ matrix.teil }}
          path: teil-b${{ matrix.bracket }}-${{ matrix.teil }}.json
          if-no-files-found: ignore

  auswerten:
    needs: spielen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: teil-b*
          merge-multiple: true
      - name: Bericht
        run: |
          {
            echo "## Forge-Probe am Archidekt-Vorrat (Gegner: B${{ inputs.gegner }})"
            echo
            node scripts/forge/pool-probe.js --auswerten teil-b*.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pool-probe
          path: teil-b*.json

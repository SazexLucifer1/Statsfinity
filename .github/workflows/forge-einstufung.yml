name: Forge bracket simulation

# Stuft ein Deck aus Statsfinity mit echten 4er-Pods ein: je Stufe 100 Partien gegen drei Test-Decks
# dieser Stufe (sim/testdecks), gespielt von den Bots der Regel-Engine Forge. Ablauf:
# scripts/forge/einstufen.js, Regel: src/app/forge-einstufung.ts, Tabelle: sql/forge-einstufung-2026-09-28.sql
#
# Zwei Wege hinein:
#   - aus der App: Developer tippen in der Deck-Ansicht auf "Simulation anfordern". Das legt einen
#     Auftrag in forge_einstufung_auftraege an; dieser Workflow sieht alle 15 Minuten nach und holt
#     den ältesten offenen ab. Ist keiner da, endet er nach wenigen Sekunden.
#   - von Hand: "Actions" -> "Forge bracket simulation" -> "Run workflow", Deck-ID eintragen
#     (steht in der Adresse hinter ?deck= , wenn man ein Deck teilt).
#
# Bracket 1 hat keine Test-Decks (sim/testdecks/README.md): Wer gegen B2 nicht mithält, ist Bracket 1.
#
# DAUER: Die vier Stufen 2-5 laufen auf vier Runnern gleichzeitig. Eine Partie dauert je nach Stufe
# 1-5 Minuten, drei laufen je Runner parallel - 100 Partien sind damit 1-3 Stunden. Bricht ein Runner
# am 6-Stunden-Limit ab, zählen die bis dahin gespielten Partien trotzdem.
#
# Braucht das Repo-Secret SUPABASE_SERVICE_ROLE_KEY (private Decks lesen, Ergebnis schreiben) und die
# einmal von Hand im SQL-Editor ausgeführte Migration sql/forge-einstufung-2026-09-28.sql. Ohne
# "Ergebnis speichern" läuft alles ohne Datenbank-Schreibzugriff; die Einstufung steht dann nur in der
# Zusammenfassung des Laufs.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      deck_id:
        description: 'Statsfinity-Deck-ID (UUID)'
        required: true
      spiele:
        description: 'Partien je Stufe. Unter 50 wird das Ergebnis zufällig, 100 ist der Standard.'
        required: true
        default: '100'
      speichern:
        description: 'Ergebnis in forge_einstufungen speichern'
        required: false
        type: boolean
        default: true

# Immer nur ein Lauf zur Zeit: Ein Deck belegt vier Runner für Stunden. Solange einer läuft, wartet
# der nächste Zeitplan-Aufruf (GitHub hält davon genau einen zurück, weitere verfallen - sie hätten
# ohnehin nur in die Warteschlange geschaut).
concurrency:
  group: forge-einstufung
  cancel-in-progress: false

jobs:
  # Welches Deck? Von Hand: die eingetragene ID. Zeitplan: der älteste offene Auftrag aus der App.
  auftrag:
    runs-on: ubuntu-latest
    outputs:
      deck_id: ${{ steps.hole.outputs.deck_id }}
      auftrag_id: ${{ steps.hole.outputs.auftrag_id }}
    steps:
      - name: Auftrag holen
        id: hole
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          URL: https://jkkelwpnrgzbvopszwrl.supabase.co/rest/v1/forge_einstufung_auftraege
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "${{ inputs.deck_id }}" ]; then
            echo "deck_id=${{ inputs.deck_id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$KEY" ]; then echo "SUPABASE_SERVICE_ROLE_KEY fehlt - keine Warteschlange."; exit 0; fi
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -H "Prefer: return=representation")
          ID=$(curl -sS "$URL?select=id&status=eq.wartet&order=erstellt_at.asc&limit=1" "${H[@]}" | jq -r '.[0].id // empty')
          if [ -z "$ID" ]; then echo "Kein offener Auftrag."; exit 0; fi
          # Nur übernehmen, wenn er noch wartet - sonst hat ihn schon jemand anderes.
          DECK=$(curl -sS -X PATCH "$URL?id=eq.$ID&status=eq.wartet" "${H[@]}" \
            -d "{\"status\":\"laeuft\",\"gestartet_at\":\"$(date -u +%FT%TZ)\",\"run_url\":\"$RUN_URL\"}" | jq -r '.[0].deck_id // empty')
          echo "Auftrag $ID, Deck $DECK"
          echo "deck_id=$DECK" >> "$GITHUB_OUTPUT"
          echo "auftrag_id=$ID" >> "$GITHUB_OUTPUT"

  forge:
    needs: auftrag
    if: needs.auftrag.outputs.deck_id != ''
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.fassung.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Forge-Fassung lesen
        id: fassung
        run: echo "commit=$(grep -oP 'FORGE_COMMIT:-\K[0-9a-f]{40}' scripts/forge/forge-setup.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Forge wird je Fassung genau einmal gebaut und danach aus dem Cache geholt.
      - uses: actions/cache@v4
        id: cache
        with:
          path: .forge
          key: forge-${{ steps.fassung.outputs.commit }}-${{ hashFiles('scripts/forge/pilot/**') }}
      - uses: actions/cache@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: maven-forge-${{ steps.fassung.outputs.commit }}
          restore-keys: maven-forge-
      - name: Forge bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/forge/forge-setup.sh .forge

  spielen:
    needs: [auftrag, forge]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        stufe: [2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: .forge
          key: forge-${{ needs.forge.outputs.commit }}-${{ hashFiles('scripts/forge/pilot/**') }}
          fail-on-cache-miss: true
      - name: Stufe ${{ matrix.stufe }} spielen
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUFTRAG: ${{ needs.auftrag.outputs.auftrag_id }}
        # Ein Runner hat 4 Kerne; eine Forge-Partie belegt gut einen davon.
        # Mit Auftrag aus der App meldet jede Partie den Stand dorthin (Fortschritt im Panel).
        run: >
          node scripts/forge/einstufen.js .forge/forge
          --deck '${{ needs.auftrag.outputs.deck_id }}'
          --stufen ${{ matrix.stufe }}
          --spiele '${{ inputs.spiele || '100' }}'
          --parallel 3
          --aus teil-b${{ matrix.stufe }}.json
          ${AUFTRAG:+--auftrag "$AUFTRAG"}
      # Auch nach Zeitüberschreitung hochladen: die bis dahin gespielten Partien zählen.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teil-b${{ matrix.stufe }}
          path: teil-b${{ matrix.stufe }}.json
          if-no-files-found: ignore

  auswerten:
    needs: [auftrag, spielen]
    if: always() && needs.auftrag.outputs.deck_id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # für den Stand der Test-Decks (git log)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: teil-b*
          merge-multiple: true
      - name: Einstufen
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Aufträge aus der App werden immer gespeichert, von Hand nur mit Haken.
          ARGS=""
          if [ "${{ inputs.speichern }}" != "false" ]; then ARGS="--speichern ${{ needs.auftrag.outputs.deck_id }}"; fi
          if [ -n "${{ needs.auftrag.outputs.auftrag_id }}" ]; then ARGS="$ARGS --auftrag ${{ needs.auftrag.outputs.auftrag_id }}"; fi
          shopt -s nullglob
          node scripts/forge/einstufen.js --auswerten teil-b*.json $ARGS | tee ergebnis.md
          cat ergebnis.md >> "$GITHUB_STEP_SUMMARY"

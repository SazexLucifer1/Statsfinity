name: Forge calibration

# Kalibrierungsturnier der Test-Decks (sim/testdecks): Trennen die Stufen überhaupt? Ablauf und Proben
# in scripts/forge/calibrate.js, Ergebnisse und Verlauf in sim/testdecks/README.md.
#
# Läuft auf GitHub statt in einer Claude-Session, weil ein Lauf Stunden dauert und eine Session ihn bei
# jedem Neustart abbricht. Nur von Hand: "Actions" -> "Forge calibration" -> "Run workflow".
#
# Setzt bei der eingecheckten sim/testdecks/kalibrierung.json fort - schon gespielte Partien werden nicht
# noch einmal gespielt. Ergebnis: Tabelle in der Zusammenfassung des Laufs, die vollständige JSON als
# Artefakt "kalibrierung". Ins Repo kommt sie per PR, nicht automatisch.
#
# Braucht kein Secret: Die Test-Decks liegen fertig im Repo.

on:
  workflow_dispatch:
    inputs:
      stufen:
        description: 'Stufen, durch Komma getrennt (je eine eigene Maschine)'
        required: true
        default: '3,4,5'
      spiele:
        description: 'Partien je Probe (innen und gegen die Stufe darunter)'
        required: true
        default: '20'

jobs:
  vorbereiten:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.fassung.outputs.commit }}
      matrix: ${{ steps.matrix.outputs.stufen }}
    steps:
      - uses: actions/checkout@v4
      - name: Forge-Fassung lesen
        id: fassung
        run: echo "commit=$(grep -oP 'FORGE_COMMIT:-\K[0-9a-f]{40}' scripts/forge/forge-setup.sh)" >> "$GITHUB_OUTPUT"
      - name: Stufen als Matrix
        id: matrix
        run: echo "stufen=[$(echo '${{ inputs.stufen }}' | tr -d ' ')]" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Derselbe Cache wie in forge-einstufung.yml: Forge wird je Fassung genau einmal gebaut.
      - uses: actions/cache@v4
        id: cache
        with:
          path: .forge
          key: forge-${{ steps.fassung.outputs.commit }}-${{ hashFiles('scripts/forge/pilot/**') }}
      - uses: actions/cache@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: maven-forge-${{ steps.fassung.outputs.commit }}
          restore-keys: maven-forge-
      - name: Forge bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/forge/forge-setup.sh .forge

  spielen:
    needs: vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        stufe: ${{ fromJSON(needs.vorbereiten.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: .forge
          key: forge-${{ needs.vorbereiten.outputs.commit }}-${{ hashFiles('scripts/forge/pilot/**') }}
          fail-on-cache-miss: true
      # Mit dem eingecheckten Stand beginnen, damit schon gespielte Partien nicht noch einmal laufen.
      - run: cp sim/testdecks/kalibrierung.json teil-b${{ matrix.stufe }}.json
      - name: Stufe ${{ matrix.stufe }} spielen
        # Ein Runner hat 4 Kerne; eine Forge-Partie belegt gut einen davon.
        run: >
          node scripts/forge/calibrate.js .forge/forge
          --stufen ${{ matrix.stufe }}
          --spiele '${{ inputs.spiele }}'
          --parallel 3
          --aus teil-b${{ matrix.stufe }}.json
      # Auch nach Zeitüberschreitung hochladen: die bis dahin gespielten Partien zählen.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teil-b${{ matrix.stufe }}
          path: teil-b${{ matrix.stufe }}.json
          if-no-files-found: ignore

  auswerten:
    needs: spielen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: teil-b*
          merge-multiple: true
      # Jedes Teil ist "eingecheckter Stand + neue Partien dieser Stufe". Zusammen: der Stand plus alle
      # neuen Einträge hinter der Ausgangslänge.
      - name: Zusammenführen
        run: |
          node -e '
            const fs = require("fs");
            const basis = JSON.parse(fs.readFileSync("sim/testdecks/kalibrierung.json", "utf8"));
            const alle = [...basis];
            for (const f of fs.readdirSync(".").filter((f) => /^teil-b\d+\.json$/.test(f)).sort()) {
              alle.push(...JSON.parse(fs.readFileSync(f, "utf8")).slice(basis.length));
            }
            fs.writeFileSync("sim/testdecks/kalibrierung.json", JSON.stringify(alle, null, 1));
            console.log(`${basis.length} vorher, ${alle.length - basis.length} neu, ${alle.length} gesamt`);
          '
      - name: Bericht
        run: |
          {
            echo "## Kalibrierung der Test-Decks"
            echo
            node scripts/forge/calibrate.js --nur-bericht --stufen '${{ inputs.stufen }}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kalibrierung
          path: sim/testdecks/kalibrierung.json
